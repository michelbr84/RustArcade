[package]
name = "rustarcade"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Rust-powered terminal game launcher. Discover, install, update, and play open-source TUI and CLI games directly from one terminal interface."
license = "MIT"
repository = "https://github.com/michelbr84/RustArcade"
homepage = "https://github.com/michelbr84/RustArcade"
readme = "README.md"
keywords = ["tui", "games", "launcher", "terminal", "ratatui"]
categories = ["command-line-utilities", "games"]
exclude = ["/.github", "/docs", "/tests"]
build = "build.rs"

[lib]
name = "rustarcade"
path = "src/lib.rs"

[[bin]]
name = "rustarcade"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
directories = "6"
which = "8"
tempfile = "3"
walkdir = "2"
url = "2.5"
semver = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
unicode-width = "0.2"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
liblzma = { version = "0.4", features = ["static"] }
ctrlc = { version = "3.5", features = ["termination"] }
indicatif = "0.18"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
httpmock = "0.8"
pretty_assertions = "1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4

[profile.dev.package."*"]
opt-level = 1
